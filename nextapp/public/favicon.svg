<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="gold" cx="40%" cy="32%" r="65%">
      <stop offset="0%"   stop-color="#f0d060"/>
      <stop offset="55%"  stop-color="#C9A84C"/>
      <stop offset="100%" stop-color="#7a5015"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%"  stop-color="#C9A84C" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="18" fill="#030813"/>
  <!-- Ambient glow -->
  <circle cx="50" cy="52" r="46" fill="url(#glow)"/>
  <!-- Border -->
  <rect x="1.5" y="1.5" width="97" height="97" rx="17"
        fill="none" stroke="#C9A84C" stroke-width="1.5" stroke-opacity="0.28"/>

  <!-- ══ SWORD 1 — blade tip NE, pommel SW ══ -->
  <g transform="rotate(45, 50, 50)" fill="url(#gold)">
    <polygon points="50,5 54.5,56 45.5,56"/>
    <rect x="36" y="55" width="28" height="7" rx="2.5"/>
    <rect x="46.5" y="62" width="7" height="16" rx="2"/>
    <ellipse cx="50" cy="82" rx="7" ry="5.5"/>
  </g>

  <!-- ══ SWORD 2 — blade tip NW, pommel SE ══ -->
  <g transform="rotate(-45, 50, 50)" fill="url(#gold)">
    <polygon points="50,5 54.5,56 45.5,56"/>
    <rect x="36" y="55" width="28" height="7" rx="2.5"/>
    <rect x="46.5" y="62" width="7" height="16" rx="2"/>
    <ellipse cx="50" cy="82" rx="7" ry="5.5"/>
  </g>

  <!-- ══ SHIELD (in front of swords) ══ -->
  <path d="M 24,20 Q 50,12 76,20 L 76,56 Q 74,74 50,88 Q 26,74 24,56 Z"
        fill="url(#gold)"/>
  <!-- Inner border -->
  <path d="M 29,25 Q 50,17 71,25 L 71,55 Q 69,71 50,84 Q 31,71 29,55 Z"
        fill="none" stroke="#030813" stroke-width="3"/>
  <!-- Surface highlight -->
  <path d="M 32,27 Q 50,20 68,27 L 68,44"
        fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="2.5" stroke-linecap="round"/>
</svg>
